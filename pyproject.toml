[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aliasrecordreview"
version = "1.0.3"
authors = [{ name = "dhtfish98" }]
description = "Bounded offline evidence review: AliasRecordReview"
requires-python = ">=3.10"
license = "MIT"
license-files = ["项目文档/LICENSE", "项目文档/NEW_IMPLEMENTATION_NOTICE.txt"]
dependencies = []

[project.scripts]
aliasrecordreview = "aliasrecordreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
